name: Integration Tests (Azure)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Testpyramide Stufe 1 (Gründer-Vorgabe, CLAUDE.md "Test-Strategie"): als
  # Release-Gate von release.yml per `uses:` aufgerufen. Sekrete kommen über
  # `secrets: inherit` im Caller — deshalb kein eigener `secrets:`-Block hier
  # nötig (GitHub Actions gibt sie trotzdem an diesen Workflow durch).
  workflow_call:
  schedule:
    # Wöchentlicher Regressionslauf (Gründer-Vorgabe 27.07.2026: Härtetest-Journeys
    # regelmäßig). Ein schedule-Event ist kein PR-/Push-Kontext — dieser Workflow
    # verwendet ohnehin nirgends github.event.pull_request/push, nur github.ref
    # (Concurrency-Gruppe, fällt für schedule auf den Default-Branch-Ref zurück)
    # und github.run_id — beide sind bei schedule-Events unverändert vorhanden.
    # Secrets/OIDC-Permissions bleiben identisch (workflow-weiter permissions-Block).
    - cron: "0 4 * * 1" # Montags 04:00 UTC

permissions:
  id-token: write
  contents: read

concurrency:
  group: integration-azure-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VAR_run_id: ${{ github.run_id }}

jobs:
  integration:
    runs-on: ubuntu-latest
    # Raised from 30 (audit 27.07.2026): the new CLI-E2E step below runs 2
    # additional real scans (intern, extern) on top of the existing pytest run.
    timeout-minutes: 40
    environment: integration-test-azure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Terraform Init
        working-directory: infra/azure
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/azure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: terraform apply -auto-approve

      - name: Export Terraform Outputs
        working-directory: infra/azure
        run: terraform output -json > ../../tests/integration/az_tf_outputs.json

      - name: Run Azure Integration Tests
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: pytest tests/integration/test_integration_az_*.py -v --tb=short -m integration -n auto

      # === CLI-E2E (Wheel) — Testpyramide Stufe "CLI-E2E gegen echte Infra" ===
      # (Gründer-Go 27.07.2026). Runs BEFORE destroy so it hits the same live
      # test infrastructure as the step above. Reuses the OIDC login already
      # done for this job — no separate auth step needed since this stays in
      # the same job. Same env vars as "Run Azure Integration Tests" above.

      - name: Build Wheel
        run: pip wheel . --no-deps --wheel-dir dist/

      - name: CLI-E2E (Wheel)
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          python -m venv .venv-e2e
          .venv-e2e/bin/pip install --quiet dist/*.whl
          export NIS2SCAN_E2E_BIN="$(pwd)/.venv-e2e/bin/nis2scan"
          pytest tests/integration/test_integration_az_nr0_cli_e2e.py -v --tb=short -m integration

      # === Cleanup Phase (always runs, even on failure) ===

      - name: Azure Login (OIDC) — for destroy
        if: always()
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (for destroy)
        if: always()
        working-directory: infra/azure
        run: terraform init

      - name: Terraform Destroy
        id: destroy
        if: always()
        working-directory: infra/azure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: terraform destroy -auto-approve
        continue-on-error: true

      - name: Nuke Resource Groups (safety net — always runs)
        if: always()
        run: |
          az group list --tag Project=nis2scan --query "[].name" -o tsv | while read rg; do
            echo "Deleting resource group: $rg"
            az group delete --name "$rg" --yes --no-wait
          done

      - name: Post-Destroy Verification
        if: always()
        run: python infra/azure/scripts/post_destroy_verify.py
