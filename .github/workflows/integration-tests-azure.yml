name: Integration Tests (Azure)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Compliance-Szenario der Testinfrastruktur (Task #54, siehe infra/azure/variables.tf)"
        type: choice
        options: [gaps, hardened, mixed]
        default: gaps
  # Testpyramide Stufe 1 (Gründer-Vorgabe, CLAUDE.md "Test-Strategie"): als
  # Release-Gate von release.yml per `uses:` aufgerufen. Sekrete kommen über
  # `secrets: inherit` im Caller — deshalb kein eigener `secrets:`-Block hier
  # nötig (GitHub Actions gibt sie trotzdem an diesen Workflow durch).
  workflow_call:
    inputs:
      scenario:
        description: "Compliance-Szenario der Testinfrastruktur (Task #54)"
        type: string
        default: gaps
  schedule:
    # Wöchentlicher Regressionslauf (Gründer-Vorgabe 27.07.2026: Härtetest-Journeys
    # regelmäßig). Ein schedule-Event ist kein PR-/Push-Kontext — dieser Workflow
    # verwendet ohnehin nirgends github.event.pull_request/push, nur github.ref
    # (Concurrency-Gruppe, fällt für schedule auf den Default-Branch-Ref zurück)
    # und github.run_id — beide sind bei schedule-Events unverändert vorhanden.
    # Secrets/OIDC-Permissions bleiben identisch (workflow-weiter permissions-Block).
    #
    # Task #54: der Wochen-Cron ist der EINZIGE Trigger, der alle drei
    # Szenarien fährt (siehe determine-scenarios-Job unten) — PR/dispatch/
    # workflow_call bekommen genau das eine gewählte (oder Default-)Szenario.
    - cron: "0 4 * * 1" # Montags 04:00 UTC

permissions:
  id-token: write
  contents: read

# Task #54: bewusst PRO PROVIDER (nicht pro Szenario) — mehrere Azure-Checks
# (CheckGeoRedundantStorage AZ-NR3-003, CheckStorageEncryption AZ-NR8-001,
# CheckStoragePublicAccess AZ-NR9-004, CheckDiagnosticSettings AZ-NR6-004)
# sind Subscription-weite Aggregat-Checks, die ALLE Storage Accounts/kritischen
# Ressourcen der Subscription auf einmal lesen (siehe infra/azure/main.tf) —
# kein einzelnes Singleton-Resource wie AWS' IAM-Passwort-Policy, aber
# funktional aequivalent gefaehrlich: zwei gleichzeitige Applies fuer
# UNTERSCHIEDLICHE Szenarien in DERSELBEN Subscription wuerden sich in genau
# diesen Aggregat-Checks gegenseitig verfaelschen. Eine gemeinsame,
# szenario-unabhaengige Concurrency-Gruppe serialisiert das, egal ob aus
# derselben Matrix oder aus zwei getrennten Workflow-Laeufen. Innerhalb EINES
# Laufs sorgt zusaetzlich strategy.max-parallel: 1 auf dem integration-Job
# dafuer, dass die Matrix-Legs strikt nacheinander laufen.
concurrency:
  group: integration-azure-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VAR_run_id: ${{ github.run_id }}

jobs:
  # Task #54: baut die Szenario-Matrix für den integration-Job. Nur der
  # Wochen-Cron (schedule) fährt alle drei Szenarien — jeder andere Trigger
  # (PR, workflow_dispatch, workflow_call/Release-Gate) bekommt genau das
  # eine gewählte bzw. Default-Szenario ("gaps"), damit PR-Läufe und das
  # Release-Gate genauso schnell/günstig bleiben wie heute.
  determine-scenarios:
    name: Determine Scenario Matrix
    # Dependabot-PRs laufen ohne Zugriff auf die Repo-Secrets; der Lauf
    # scheitert dort zwangslaeufig an der OIDC-Anmeldung und hinterlaesst
    # dauerhaft rote Kacheln, die echte Ausfaelle maskieren (30.07.2026).
    # Ein Provider- oder SDK-Bump gehoert trotzdem integrationsgetestet:
    # vor dem Merge einmal per "Run workflow" (workflow_dispatch) auf dem
    # PR-Branch fahren.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.matrix.outputs.scenarios }}
    steps:
      - name: Build scenario matrix
        id: matrix
        env:
          CHOSEN_SCENARIO: ${{ inputs.scenario || 'gaps' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'scenarios=["gaps","hardened","mixed"]' >> "$GITHUB_OUTPUT"
          else
            echo "scenarios=[\"$CHOSEN_SCENARIO\"]" >> "$GITHUB_OUTPUT"
          fi

  integration:
    needs: determine-scenarios
    strategy:
      # Serialisiert die Matrix-Legs (siehe concurrency-Kommentar oben) —
      # niemals mehrere Szenarien gleichzeitig gegen dieselbe Subscription.
      max-parallel: 1
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(needs.determine-scenarios.outputs.scenarios) }}
    runs-on: ubuntu-latest
    # Raised from 30 (audit 27.07.2026): the CLI-E2E step below runs 2
    # additional real scans (intern, extern) on top of the existing pytest run.
    timeout-minutes: 40
    environment: integration-test-azure
    env:
      TF_VAR_scenario: ${{ matrix.scenario }}
      NIS2SCAN_SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Terraform Init
        working-directory: infra/azure
        # -lockfile=readonly (30.07.2026): siehe integration-tests-aws.yml.
        # Genau hier brach azurerm 5.0.0 das Release-Gate von v0.2.0, weil der
        # Lock ignoriert war und init frisch aufloeste. Nur Apply-Pfad, nicht
        # Destroy.
        run: terraform init -lockfile=readonly

      - name: Terraform Apply
        working-directory: infra/azure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: terraform apply -auto-approve

      - name: Export Terraform Outputs
        working-directory: infra/azure
        run: terraform output -json > ../../tests/integration/az_tf_outputs.json

      # ARM propagation delay (Szenario-Matrix-Fund 28.07.2026): freshly
      # written NSG security_rules can come back EMPTY from
      # network_security_groups.list_all() for a short window after apply,
      # so a scan reads the just-opened rule as still-restricted and reports
      # the NSG compliant when the mixed/gaps scenario expects non_compliant
      # (AZ-NR9-003). Same class as the GCP Cloud-Asset-Inventory wait below.
      - name: Wait for Azure ARM propagation
        run: echo "Waiting 60s for ARM resource/rule propagation..." && sleep 60

      - name: Run Azure Integration Tests
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: pytest tests/integration/test_integration_az_*.py -v --tb=short -m integration -n auto

      # === CLI-E2E (Wheel) — Testpyramide Stufe "CLI-E2E gegen echte Infra" ===
      # (Gründer-Go 27.07.2026). Runs BEFORE destroy so it hits the same live
      # test infrastructure as the step above. Reuses the OIDC login already
      # done for this job — no separate auth step needed since this stays in
      # the same job. Same env vars as "Run Azure Integration Tests" above.

      - name: Build Wheel
        run: pip wheel . --no-deps --wheel-dir dist/

      - name: CLI-E2E (Wheel)
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          python -m venv .venv-e2e
          .venv-e2e/bin/pip install --quiet dist/*.whl
          export NIS2SCAN_E2E_BIN="$(pwd)/.venv-e2e/bin/nis2scan"
          pytest tests/integration/test_integration_az_nr0_cli_e2e.py -v --tb=short -m integration

      # === Cleanup Phase (always runs, even on failure) ===

      - name: Azure Login (OIDC) — for destroy
        if: always()
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (for destroy)
        if: always()
        working-directory: infra/azure
        run: terraform init

      - name: Terraform Destroy
        id: destroy
        if: always()
        working-directory: infra/azure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: terraform destroy -auto-approve
        continue-on-error: true

      - name: Nuke Resource Groups (safety net — always runs)
        if: always()
        run: |
          az group list --tag Project=nis2scan --query "[].name" -o tsv | while read rg; do
            echo "Deleting resource group: $rg"
            az group delete --name "$rg" --yes --no-wait
          done

      - name: Post-Destroy Verification
        if: always()
        run: python infra/azure/scripts/post_destroy_verify.py
