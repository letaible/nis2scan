name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check nis2scan/ tests/
      - name: Ruff format check
        run: ruff format --check nis2scan/ tests/
      - name: Type check
        run: mypy nis2scan/
      - name: Unit tests
        # Coverage is reported (term-missing) but not gated yet (Audit TEST-3) —
        # a --cov-fail-under gate follows once the known coverage gaps are closed.
        run: pytest tests/ -m "not integration" -v --tb=short -n auto --cov=nis2scan --cov-report=term-missing

  dependency-audit:
    name: Dependency vulnerability audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pip-audit
        # NICHT blockierend (Batch R2-B, Erstscharf-Schaltung): Stand
        # 24.07.2026 meldet pip-audit gegen eine frische Installation der
        # aktuellen pyproject.toml keine bekannten Vulnerabilities (0
        # Findings). continue-on-error bleibt trotzdem zunaechst gesetzt,
        # weil pip-audit gegen eine live gepflegte Vulnerability-DB (OSV)
        # prueft, die sich taeglich aendern kann, und weil es fuer neue
        # Findings noch keinen etablierten Triage-/Exception-Prozess in CI
        # gibt (vgl. ADR-0026 fuer Findings im Scan-Kontext). Sobald ein
        # erster echter Fund sauber triagiert wurde (oder nach einer
        # Beobachtungsphase ohne Fund), wird continue-on-error entfernt und
        # der Job blockiert den Merge wie lint-and-test.
        continue-on-error: true
        run: pip-audit --progress-spinner=off

  cli-smoke:
    name: CLI package smoke test (${{ matrix.os }})
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        # The manual CLI hardening test 25.-27.07.2026 ran on customer
        # Windows, but this job previously only ever ran on Linux — the
        # Windows leg of this matrix closes that gap permanently (cp1252
        # console encoding, path separators, venv Scripts/ layout, .exe
        # entry points).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on windows-latest runners gives us one shell syntax for
        # both OSes instead of duplicating every step for pwsh vs bash.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Create the smoke venv
        # Layout differs between OSes (Scripts/*.exe on Windows vs bin/* on
        # Linux) — resolve it once into env vars every later step reuses.
        run: |
          python -m venv smoke-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "BIN_DIR=smoke-venv/Scripts" >> "$GITHUB_ENV"
            echo "EXT=.exe" >> "$GITHUB_ENV"
          else
            echo "BIN_DIR=smoke-venv/bin" >> "$GITHUB_ENV"
            echo "EXT=" >> "$GITHUB_ENV"
          fi
      - name: Install the built wheel + pytest into the smoke venv
        # Deliberately NOT an editable install (pip install -e .) — the unit
        # test suite already runs against the editable checkout and would not
        # catch packaging bugs (missing package data, entry points, etc.).
        # This installs the actual built artifact, like a real user would
        # (Audit TEST-P0-Lehre). pytest is installed separately since the
        # smoke venv otherwise carries none of the [dev] extras.
        run: |
          "$BIN_DIR/pip$EXT" install --upgrade pip
          "$BIN_DIR/pip$EXT" install dist/*.whl "pytest>=8.0.0"
          echo "NIS2SCAN_SMOKE_BIN=$BIN_DIR/nis2scan$EXT" >> "$GITHUB_ENV"
      - name: Run CLI package smoke tests (real installed wheel, subprocess)
        # Replaces the previous hand-rolled bash exit-code checks below this
        # comment (removed): this package covers --version/--help, the
        # permissions matrix (3 providers x 3 formats, incl. real
        # file-redirected terraform/json output), a credential-less scan per
        # provider (asserts exit 3, the German "Ursache" hint block, and the
        # JSON contract for both report profiles), and the CLI misuse matrix
        # (exit 64 / EX_USAGE). See tests/test_cli_package/ for the full
        # journey-by-journey breakdown.
        run: "$BIN_DIR/python$EXT" -m pytest tests/test_cli_package/ -v -m package_smoke
        timeout-minutes: 30
