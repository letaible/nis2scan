name: Integration Tests (AWS)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Testpyramide Stufe 1 (Gründer-Vorgabe, CLAUDE.md "Test-Strategie"): als
  # Release-Gate von release.yml per `uses:` aufgerufen. Sekrete kommen über
  # `secrets: inherit` im Caller — deshalb kein eigener `secrets:`-Block hier
  # nötig (GitHub Actions gibt sie trotzdem an diesen Workflow durch).
  workflow_call:
  schedule:
    # Wöchentlicher Regressionslauf (Gründer-Vorgabe 27.07.2026: Härtetest-Journeys
    # regelmäßig). Ein schedule-Event ist kein PR-/Push-Kontext — dieser Workflow
    # verwendet ohnehin nirgends github.event.pull_request/push, nur github.ref
    # (Concurrency-Gruppe, fällt für schedule auf den Default-Branch-Ref zurück)
    # und github.run_id — beide sind bei schedule-Events unverändert vorhanden.
    # Secrets/OIDC-Permissions bleiben identisch (workflow-weiter permissions-Block).
    - cron: "0 3 * * 1" # Montags 03:00 UTC

permissions:
  id-token: write
  contents: read

concurrency:
  group: integration-aws-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  TF_VAR_run_id: ${{ github.run_id }}

jobs:
  integration:
    runs-on: ubuntu-latest
    # Raised from 30 (audit 27.07.2026): the new CLI-E2E step below runs 5
    # additional real scans (intern, extern, and 3 scoped exceptions-flow
    # scans) on top of the existing pytest run — needs headroom.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" pyotp

      - name: Terraform Init
        working-directory: infra/aws
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/aws
        run: terraform apply -auto-approve

      - name: Export Terraform Outputs
        working-directory: infra/aws
        run: terraform output -json > ../../tests/integration/tf_outputs.json

      - name: Run Integration Tests
        # test_integration_exceptions.py is named outside the nr* pattern and
        # must be listed explicitly — it exercises the ADR-0026 exceptions
        # flow against a known intentional gap in the test infrastructure.
        run: pytest tests/integration/test_integration_nr*.py tests/integration/test_integration_exceptions.py -v --tb=short -m integration -n auto

      # === CLI-E2E (Wheel) — Testpyramide Stufe "CLI-E2E gegen echte Infra" ===
      # (Gründer-Go 27.07.2026). Runs BEFORE destroy so it hits the same live
      # test infrastructure as the step above. Reuses the OIDC credentials the
      # "Configure AWS Credentials" step already set up for this job — no
      # separate auth step needed since this stays in the same job.

      - name: Build Wheel
        run: pip wheel . --no-deps --wheel-dir dist/

      - name: CLI-E2E (Wheel)
        run: |
          python -m venv .venv-e2e
          .venv-e2e/bin/pip install --quiet dist/*.whl
          export NIS2SCAN_E2E_BIN="$(pwd)/.venv-e2e/bin/nis2scan"
          pytest tests/integration/test_integration_nr0_cli_e2e.py -v --tb=short -m integration

      # === Cleanup Phase (always runs, even on failure) ===

      - name: Pre-Destroy Cleanup (IAM MFA, login profiles, access keys)
        if: always()
        run: python infra/aws/scripts/pre_destroy_cleanup.py

      - name: Terraform Init (for destroy)
        if: always()
        working-directory: infra/aws
        run: terraform init

      - name: Terraform Destroy
        id: destroy
        if: always()
        working-directory: infra/aws
        run: terraform destroy -auto-approve
        continue-on-error: true

      - name: Nuke Remaining Resources (safety net — always runs)
        if: always()
        run: python infra/aws/scripts/nuke_test_resources.py

      - name: Post-Destroy Verification
        if: always()
        run: python infra/aws/scripts/post_destroy_verify.py --region ${{ env.AWS_REGION }}
