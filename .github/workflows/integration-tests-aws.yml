name: Integration Tests (AWS)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Compliance-Szenario der Testinfrastruktur (Task #54, siehe infra/aws/variables.tf)"
        type: choice
        options: [gaps, hardened, mixed]
        default: gaps
  # Testpyramide Stufe 1 (Gründer-Vorgabe, CLAUDE.md "Test-Strategie"): als
  # Release-Gate von release.yml per `uses:` aufgerufen. Sekrete kommen über
  # `secrets: inherit` im Caller — deshalb kein eigener `secrets:`-Block hier
  # nötig (GitHub Actions gibt sie trotzdem an diesen Workflow durch).
  workflow_call:
    inputs:
      scenario:
        description: "Compliance-Szenario der Testinfrastruktur (Task #54)"
        type: string
        default: gaps
  schedule:
    # Wöchentlicher Regressionslauf (Gründer-Vorgabe 27.07.2026: Härtetest-Journeys
    # regelmäßig). Ein schedule-Event ist kein PR-/Push-Kontext — dieser Workflow
    # verwendet ohnehin nirgends github.event.pull_request/push, nur github.ref
    # (Concurrency-Gruppe, fällt für schedule auf den Default-Branch-Ref zurück)
    # und github.run_id — beide sind bei schedule-Events unverändert vorhanden.
    # Secrets/OIDC-Permissions bleiben identisch (workflow-weiter permissions-Block).
    #
    # Task #54: der Wochen-Cron ist der EINZIGE Trigger, der alle drei
    # Szenarien fährt (siehe determine-scenarios-Job unten) — PR/dispatch/
    # workflow_call bekommen genau das eine gewählte (oder Default-)Szenario.
    - cron: "0 3 * * 1" # Montags 03:00 UTC

permissions:
  id-token: write
  contents: read

# Task #54: bewusst PRO PROVIDER (nicht pro Szenario) — mehrere Fixtures sind
# Konto-Singletons (IAM-Passwort-Policy, EBS-Default-Encryption, S3-Account-
# Public-Access-Block, siehe Kommentare in infra/aws/main.tf und den
# betroffenen Modulen). Zwei Szenario-Applies dürfen im selben AWS-Konto NIE
# parallel laufen, egal ob aus derselben Matrix oder aus zwei getrennten
# Workflow-Läufen — eine gemeinsame, szenario-unabhängige Gruppe serialisiert
# beides. Innerhalb EINES Laufs sorgt außerdem strategy.max-parallel: 1 auf
# dem integration-Job dafür, dass die Matrix-Legs strikt nacheinander laufen.
concurrency:
  group: integration-aws-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  TF_VAR_run_id: ${{ github.run_id }}

jobs:
  # Task #54: baut die Szenario-Matrix für den integration-Job. Nur der
  # Wochen-Cron (schedule) fährt alle drei Szenarien — jeder andere Trigger
  # (PR, workflow_dispatch, workflow_call/Release-Gate) bekommt genau das
  # eine gewählte bzw. Default-Szenario ("gaps"), damit PR-Läufe und das
  # Release-Gate genauso schnell/günstig bleiben wie heute.
  determine-scenarios:
    name: Determine Scenario Matrix
    # Siehe integration-tests-azure.yml: Dependabot-PRs bekommen keine
    # Secrets, scheitern an der OIDC-Anmeldung und erzeugen nur rotes
    # Rauschen. Bump vor dem Merge per workflow_dispatch testen.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.matrix.outputs.scenarios }}
    steps:
      - name: Build scenario matrix
        id: matrix
        env:
          CHOSEN_SCENARIO: ${{ inputs.scenario || 'gaps' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'scenarios=["gaps","hardened","mixed"]' >> "$GITHUB_OUTPUT"
          else
            echo "scenarios=[\"$CHOSEN_SCENARIO\"]" >> "$GITHUB_OUTPUT"
          fi

  integration:
    needs: determine-scenarios
    strategy:
      # Serialisiert die Matrix-Legs (siehe concurrency-Kommentar oben) —
      # niemals mehrere Szenarien gleichzeitig gegen dasselbe Konto.
      max-parallel: 1
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(needs.determine-scenarios.outputs.scenarios) }}
    runs-on: ubuntu-latest
    # Raised from 30 (audit 27.07.2026): the new CLI-E2E step below runs 5
    # additional real scans (intern, extern, and 3 scoped exceptions-flow
    # scans) on top of the existing pytest run — needs headroom.
    timeout-minutes: 45
    env:
      TF_VAR_scenario: ${{ matrix.scenario }}
      NIS2SCAN_SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" pyotp

      - name: Terraform Init
        working-directory: infra/aws
        # -lockfile=readonly (30.07.2026): bricht LAUT ab, wenn Constraint und
        # eingecheckte .terraform.lock.hcl auseinanderlaufen, statt still eine
        # neue Providerversion zu ziehen. Bewusst NUR auf dem Apply-Pfad — der
        # Destroy-Init unten laeuft ohne, sonst wuerde ein Lock-Formalfehler
        # das Aufraeumen blockieren und kostenpflichtige Ressourcen stehen
        # lassen. Providerwechsel gehen ueber `terraform init -upgrade` in
        # einem eigenen PR mit gruenem Integrationslauf.
        run: terraform init -lockfile=readonly

      - name: Terraform Apply
        working-directory: infra/aws
        run: terraform apply -auto-approve

      - name: Export Terraform Outputs
        working-directory: infra/aws
        run: terraform output -json > ../../tests/integration/tf_outputs.json

      - name: Run Integration Tests
        # test_integration_exceptions.py is named outside the nr* pattern and
        # must be listed explicitly — it exercises the ADR-0026 exceptions
        # flow against a known intentional gap in the test infrastructure.
        run: pytest tests/integration/test_integration_nr*.py tests/integration/test_integration_exceptions.py -v --tb=short -m integration -n auto

      # === CLI-E2E (Wheel) — Testpyramide Stufe "CLI-E2E gegen echte Infra" ===
      # (Gründer-Go 27.07.2026). Runs BEFORE destroy so it hits the same live
      # test infrastructure as the step above. Reuses the OIDC credentials the
      # "Configure AWS Credentials" step already set up for this job — no
      # separate auth step needed since this stays in the same job.

      - name: Build Wheel
        run: pip wheel . --no-deps --wheel-dir dist/

      - name: CLI-E2E (Wheel)
        run: |
          python -m venv .venv-e2e
          .venv-e2e/bin/pip install --quiet dist/*.whl
          export NIS2SCAN_E2E_BIN="$(pwd)/.venv-e2e/bin/nis2scan"
          pytest tests/integration/test_integration_nr0_cli_e2e.py -v --tb=short -m integration

      # === Cleanup Phase (always runs, even on failure) ===

      - name: Pre-Destroy Cleanup (IAM MFA, login profiles, access keys)
        if: always()
        run: python infra/aws/scripts/pre_destroy_cleanup.py

      - name: Terraform Init (for destroy)
        if: always()
        working-directory: infra/aws
        run: terraform init

      - name: Terraform Destroy
        id: destroy
        if: always()
        working-directory: infra/aws
        run: terraform destroy -auto-approve
        continue-on-error: true

      - name: Nuke Remaining Resources (safety net — always runs)
        if: always()
        run: python infra/aws/scripts/nuke_test_resources.py

      - name: Post-Destroy Verification
        if: always()
        run: python infra/aws/scripts/post_destroy_verify.py --region ${{ env.AWS_REGION }}
