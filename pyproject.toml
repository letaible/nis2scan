[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nis2scan"
dynamic = ["version"]
description = "Open-source NIS2 compliance scanner for AWS, Azure & GCP cloud environments. Maps findings to §30 BSIG and ISO 27001:2022."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "VVulpe" },
]
keywords = ["nis2", "compliance", "cloud-security", "aws", "azure", "gcp", "bsig", "isms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.35.0",
    "azure-identity>=1.17.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-resource-subscriptions>=1.0.0b1",
    "azure-mgmt-resource-policy>=1.0.0b2",
    "azure-mgmt-storage>=21.0.0",
    "azure-mgmt-compute>=31.0.0",
    "azure-mgmt-network>=26.0.0",  # NOTE: list_all() used by nr10 VPN-gateway check does not exist in ANY
                                    # known version (26.0.0-31.0.1) -- pre-existing code bug, not SDK drift,
                                    # deliberately left unpinned (see pin-verification report 27.07.2026)
    "azure-mgmt-keyvault>=10.3.0",
    "azure-mgmt-sql>=3.0.1",
    "azure-mgmt-web>=7.2.0",
    "azure-mgmt-monitor>=6.0.0,<7.0.0",  # 7.0.0 removed the diagnostic_settings operation group entirely
                                          # from MonitorManagementClient (breaks AZ-NR1-004/AZ-NR6-004)
    "azure-mgmt-security>=6.0.0,<7.0.0",  # 7.0.0 bumped the default pricings API to 2024-01-01, which added
                                           # a mandatory scope_id arg to pricings.list() (breaks AZ-NR1-001/
                                           # AZ-NR5-001). NOTE: AZ-NR6-001's separate SecureScoreItem.current_score
                                           # AttributeError is NOT fixed by this pin -- the real attribute is
                                           # `current`/`max` in every checked version incl. 6.0.0; that is a
                                           # pre-existing code bug in nr6_wirksamkeit.py, not SDK drift.
    "azure-mgmt-recoveryservices>=3.0.0",
    "azure-mgmt-recoveryservicesbackup>=9.0.0",
    "azure-mgmt-containerregistry>=10.0.0",
    "azure-mgmt-authorization>=4.0.0",
    "azure-mgmt-policyinsights>=1.0.0",
    "azure-mgmt-loganalytics>=13.0.0",
    "azure-mgmt-managementgroups>=2.0.0",
    "google-auth>=2.29.0",
    "google-cloud-resource-manager>=1.12.0",
    "google-cloud-compute>=1.18.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-kms>=2.21.0",
    "google-cloud-logging>=3.10.0",  # NOTE: logging_v2.MetricsServiceV2Client/ConfigServiceV2Client (used by
                                      # GCP-NR2-004/005, GCP-NR6-001) were never top-level exports in ANY
                                      # release 2.0.0-3.16.1 -- pre-existing code bug (wrong import path;
                                      # correct: google.cloud.logging_v2.services.{metrics_service_v2,
                                      # config_service_v2}.client), not SDK drift, deliberately left unpinned.
    "google-cloud-monitoring>=2.21.0",
    "google-cloud-securitycenter>=1.28.0",
    "google-cloud-container>=2.44.0",
    "google-cloud-asset>=3.26.0",
    "google-cloud-dns>=0.35.0",
    "google-api-python-client>=2.125.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "structlog>=24.1.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "moto[all]>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "boto3-stubs[essential]>=1.35.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
nis2scan = "nis2scan.cli.cli:app"

[project.urls]
Homepage = "https://github.com/letaible/nis2scan"
Repository = "https://github.com/letaible/nis2scan"
Issues = "https://github.com/letaible/nis2scan/issues"
Documentation = "https://github.com/letaible/nis2scan/tree/main/docs"

[tool.hatch.version]
# Single source of truth for the package version — bump ONLY here;
# pyproject, CLI --version and the plugin loader all read from it.
path = "nis2scan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["nis2scan"]

[tool.hatch.build.targets.sdist]
# Distribution contains only the package and licensing/readme files —
# never docs, infra, tests, or local tooling directories.
include = [
    "/nis2scan",
    "/README.md",
    "/LICENSE",
]
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"nis2scan/cli/cli.py" = ["B008", "A002"]  # B008: typer.Option() in defaults is the standard pattern; A002: --format CLI flag

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests requiring real AWS infrastructure (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "google.*",
    "googleapiclient.*",
    "google_cloud_asset.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["nis2scan"]
omit = ["tests/*"]
